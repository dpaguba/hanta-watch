[project]
name = "hanta-watch-etl"
version = "0.1.0"
description = "ETL pipeline for the Hanta-Watch global hantavirus tracker"
requires-python = ">=3.10"
readme = "../README.md"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
