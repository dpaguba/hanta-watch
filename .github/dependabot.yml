version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # Majors stay out of the group: one of them being unmergeable would
      # otherwise hold back every routine bump in the same pull request.
      web:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # react-simple-maps 3 declares a peer range that stops at React 18, so
      # npm cannot resolve a tree with React 19 in it. These majors can move
      # once the map library does, or once it is replaced.
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react"
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react-dom"
        update-types: [version-update:semver-major]

  - package-ecosystem: pip
    directory: /etl
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
