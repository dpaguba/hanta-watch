name: Deploy

# A push made by the ETL job carries GITHUB_TOKEN, and GitHub deliberately does
# not start workflows from those pushes. Without the workflow_run trigger the
# data would refresh in the repository and never on the published site, which is
# the whole point of the hourly run.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [ETL]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # A failed ETL run should not publish whatever happens to be on disk.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Lint & typecheck
        working-directory: web
        run: |
          npm run typecheck
          npm run lint --if-present

      - name: Test
        working-directory: web
        run: npm test --if-present -- --run

      - name: Build
        working-directory: web
        env:
          VITE_BASE: "/${{ github.event.repository.name }}/"
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
